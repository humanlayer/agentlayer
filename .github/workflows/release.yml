name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Get version and npm tag from git tag
        id: version
        run: bun run scripts/release/tag-info.ts
      - run: bun install --frozen-lockfile
      - run: bun run biome:check
      - run: bun run typecheck
      - run: bun run test:ci
      - run: bun run docs:build
      - run: bun run build:packages
      - run: bun run release:prepare --version "${{ steps.version.outputs.version }}"
      - run: bun run release:publish --version "${{ steps.version.outputs.version }}" --tag "${{ steps.version.outputs.tag }}"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
