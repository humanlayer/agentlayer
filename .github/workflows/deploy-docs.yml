name: Deploy Docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'packages/docs/**'

permissions:
  contents: read

jobs:
  deploy-docs:
    uses: ./.github/workflows/pulumi-deploy-project.yml
    with:
      project-path: packages/docs
      stack: humanlayer/agentlayer-docs/prod
      action: up
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
