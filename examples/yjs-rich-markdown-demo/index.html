<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rich Markdown Learning Demo</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body, #root {
        height: 100%;
        width: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .tiptap {
        min-height: 200px;
        padding: 16px;
        outline: none;
      }
      .tiptap:focus {
        outline: none;
      }
      .tiptap p.is-editor-empty:first-child::before {
        color: #adb5bd;
        content: attr(data-placeholder);
        float: left;
        height: 0;
        pointer-events: none;
      }
      .collaboration-cursor__caret {
        position: relative;
        margin-left: -1px;
        margin-right: -1px;
        border-left: 1px solid;
        border-right: 1px solid;
        word-break: normal;
        pointer-events: none;
      }
      .collaboration-cursor__label {
        position: absolute;
        top: -1.4em;
        left: -1px;
        font-size: 12px;
        font-style: normal;
        font-weight: 600;
        line-height: normal;
        user-select: none;
        color: #fff;
        padding: 0.1rem 0.3rem;
        border-radius: 3px 3px 3px 0;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
